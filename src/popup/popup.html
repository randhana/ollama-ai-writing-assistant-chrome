<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Writing Assistant</title>
    <link href="popup.css" rel="stylesheet">
</head>
<body class="w-96 h-auto bg-gray-50">
    <div class="bg-white shadow-lg">
        <!-- Header -->
        <header class="bg-gradient-to-r from-blue-600 to-blue-700 text-white px-4 py-3">
            <div class="flex items-center justify-between">
                <h1 class="text-lg font-semibold">AI Writing Assistant</h1>
                <button id="settingsBtn" class="p-1 hover:bg-blue-500 rounded transition-colors" title="Settings">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                    </svg>
                </button>
            </div>
            
            <!-- Status indicator -->
            <div class="flex items-center mt-2 text-sm">
                <div id="statusIndicator" class="w-2 h-2 rounded-full mr-2"></div>
                <span id="statusText">Checking connection...</span>
            </div>
        </header>

        <!-- Main content -->
        <main class="p-4">
            <!-- Quick toggle -->
            <div class="flex items-center justify-between mb-4 p-3 bg-gray-100 rounded-lg">
                <div>
                    <span class="font-medium text-gray-800">Enable Assistant</span>
                    <p class="text-sm text-gray-600">Real-time writing suggestions</p>
                </div>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="enableToggle" class="sr-only peer">
                    <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-blue-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600"></div>
                </label>
            </div>

            <!-- Text analysis area -->
            <div class="mb-4">
                <label for="textInput" class="block text-sm font-medium text-gray-700 mb-2">
                    Analyze Text
                </label>
                <textarea 
                    id="textInput" 
                    placeholder="Type or paste text here to get writing suggestions..."
                    class="w-full h-24 p-3 border border-gray-300 rounded-lg resize-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm"
                    maxlength="500"
                ></textarea>
                <div class="flex justify-between items-center mt-2">
                    <span id="charCount" class="text-xs text-gray-500">0/500 characters</span>
                    <button 
                        id="analyzeBtn" 
                        class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 disabled:bg-gray-400 disabled:cursor-not-allowed transition-colors text-sm font-medium"
                        disabled
                    >
                        Analyze
                    </button>
                </div>
            </div>

            <!-- Tone selector -->
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    Writing Tone
                </label>
                <select 
                    id="toneSelect" 
                    class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm"
                >
                    <option value="professional">Professional</option>
                    <option value="casual">Casual</option>
                    <option value="friendly">Friendly</option>
                    <option value="persuasive">Persuasive</option>
                    <option value="academic">Academic</option>
                </select>
            </div>

            <!-- Loading state -->
            <div id="loadingState" class="hidden text-center py-4">
                <div class="inline-flex items-center">
                    <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-blue-600" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span class="text-sm text-gray-600">Analyzing text...</span>
                </div>
            </div>

            <!-- Results area -->
            <div id="resultsArea" class="hidden">
                <h3 class="text-sm font-medium text-gray-700 mb-3">Suggestions</h3>
                
                <!-- Corrected text -->
                <div id="correctedText" class="mb-4 p-3 bg-green-50 border border-green-200 rounded-lg">
                    <div class="flex items-start justify-between">
                        <div class="flex-1">
                            <h4 class="text-sm font-medium text-green-800 mb-1">Corrected Text</h4>
                            <p id="correctedContent" class="text-sm text-green-700"></p>
                        </div>
                        <button id="copyCorrected" class="ml-2 p-1 text-green-600 hover:text-green-800 transition-colors" title="Copy to clipboard">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Paraphrased text -->
                <div id="paraphrasedText" class="mb-4 p-3 bg-blue-50 border border-blue-200 rounded-lg">
                    <div class="flex items-start justify-between">
                        <div class="flex-1">
                            <h4 class="text-sm font-medium text-blue-800 mb-1">Paraphrased</h4>
                            <p id="paraphrasedContent" class="text-sm text-blue-700"></p>
                        </div>
                        <button id="copyParaphrased" class="ml-2 p-1 text-blue-600 hover:text-blue-800 transition-colors" title="Copy to clipboard">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Improvement suggestions -->
                <div id="suggestions" class="mb-4">
                    <h4 class="text-sm font-medium text-gray-700 mb-2">Improvement Tips</h4>
                    <ul id="suggestionsList" class="space-y-1"></ul>
                </div>
            </div>

            <!-- Error state -->
            <div id="errorState" class="hidden p-3 bg-red-50 border border-red-200 rounded-lg">
                <div class="flex items-center">
                    <svg class="w-4 h-4 text-red-600 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    <span id="errorMessage" class="text-sm text-red-700"></span>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="border-t bg-gray-50 px-4 py-3">
            <div class="flex items-center justify-between text-xs text-gray-500">
                <span>Powered by Ollama LLaMA 3.2</span>
                <button id="openOptions" class="text-blue-600 hover:text-blue-800 transition-colors">
                    Configure
                </button>
            </div>
        </footer>
    </div>

    <script src="popup.js"></script>
</body>
</html>
